kind = "mobile"
previewPath = "/mobile/"
title = "CashCollect Mobile"
version = "1.0.0"
id = "artifacts/cashcollect-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 23144

[services.development]
run = "pnpm --filter @workspace/cashcollect-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashcollect-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cashcollect-mobile", "run", "serve" ]

[services.env]
PORT = "23144"
BASE_PATH = "/mobile/"
