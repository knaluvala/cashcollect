kind = "web"
previewPath = "/"
title = "CashCollect"
version = "1.0.0"
id = "artifacts/cashcollect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23155

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashcollect", "run", "build" ]
publicDir = "artifacts/cashcollect/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23155"
BASE_PATH = "/"
