kind = "web"
previewPath = "/"
title = "CashCollect"
version = "1.0.0"
id = "artifacts/cashcollect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 5173

[services.development]
run = "bash /home/runner/workspace/scripts/start-cashcollect-dev.sh"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashcollect", "run", "build" ]
publicDir = "artifacts/cashcollect/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
VITE_PORT = "5173"